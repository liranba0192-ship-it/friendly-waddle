<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>חלבונינץ 🌅</title>
  <meta name="description" content="תדריך ידע יומי, מעקב אימונים (Progressive Overload), יומן אוכל ושקילה." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0a" id="themeColor" />

  <!-- iOS "add to home screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="חלבונינץ" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="appTitle" class="app-title">חלבונינץ</h1>
    <button id="settingsBtn" class="settings-gear" aria-label="הגדרות ותזכורות"></button>
  </header>

  <main class="content">
    <section id="view-home" class="view"></section>
    <section id="view-workout" class="view" hidden></section>
    <section id="view-food" class="view" hidden></section>
    <section id="view-shop" class="view" hidden></section>
    <section id="view-me" class="view" hidden></section>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="ניווט"></nav>

  <!-- מסך כניסה — גלוי עד להתחברות, מוסתר אחריה -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-panel">
      <div class="auth-mark" id="auth-mark" aria-hidden="true"></div>
      <h1 class="auth-title">חלבונינץ</h1>
      <p class="auth-slogan">דלק אמיתי. שיא אמיתי.</p>
      <div id="auth-body"></div>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/briefing.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/food.js"></script>
  <script src="js/weight.js"></script>
  <script src="js/more.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/helpbot.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/home.js"></script>
  <script src="js/me.js"></script>
  <script src="app.js"></script>
</body>
</html>
